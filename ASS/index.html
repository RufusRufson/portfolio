<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700&display=swap');

.youtube-gallery {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
  background: #000;
  padding: 20px;
}

.video-heading {
  grid-column: 1 / -1;
  width: 100%;
  margin: 35px 0 15px;
  padding: 15px 0;
  font-family: 'Orbitron', sans-serif;
  font-size: 23px;
  font-weight: 600;
  letter-spacing: 4px;
  text-align: center;
  text-transform: uppercase;
  color: #ffffff;
}

.youtube-video {
  position: relative;
  aspect-ratio: 16/9;
  cursor: pointer;
  background: #000;
  overflow: hidden;
}

.youtube-video img,
.youtube-video iframe {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border: 0;
  display: block;
}

.play-button {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: #f00;
  color: white;
  border: 0;
  border-radius: 12px;
  padding: 12px 20px;
  font-size: 22px;
  cursor: pointer;
}
</style>

<script>
document.querySelectorAll('.youtube-video').forEach(video => {

  const id = video.dataset.id;

  const img = document.createElement('img');
  img.src = `https://img.youtube.com/vi/${id}/hqdefault.jpg`;
  img.alt = 'Video';

  const button = document.createElement('button');
  button.className = 'play-button';
  button.textContent = '▶';

  video.appendChild(img);
  video.appendChild(button);

  video.addEventListener('click', function() {
    const iframe = document.createElement('iframe');
    iframe.src = `https://www.youtube.com/embed/${id}?autoplay=1&mute=1&loop=1&playlist=${id}&playsinline=1`;
    iframe.allow = 'autoplay; encrypted-media; picture-in-picture';
    iframe.allowFullscreen = true;

    this.innerHTML = '';
    this.appendChild(iframe);
  });

});
</script>
