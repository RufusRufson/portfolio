CRT SCREEN EFFECT

SCANLINES + VIGNETTE

=================================================

body::before{

    content:"";

    position:fixed;

    inset:0;

    pointer-events:none;


    background:

    radial-gradient(
        ellipse at center,
        transparent 40%,
        rgba(0,0,0,.8) 100%

}



body::after{


    content:"";

    position:fixed;

    inset:0;

    pointer-events:none;


    background:

    repeating-linear-gradient(

        to bottom,

        rgba(0,255,100,.035) 0px,

        rgba(0,255,100,.035) 1px,

        transparent 2px,

        transparent 4px

    );


    animation:

        scanMove 8s linear infinite;


    z-index:30;

}

    from{

        transform:translateY(0);

    }


    to{

        transform:translateY(4px);

    }

}

=================================================

MAIN LAYOUT

=================================================

#container{

    height:100%;

TERMINAL WINDOWS

=================================================

=================================================

PRIMARY DISPLAY

=================================================

        0 0 45px rgba(0,255,102,.4);

SECONDARY DISPLAY

=================================================

/*
=================================================

GLOW PULSATION

=================================================
*/


@keyframes terminalPulse{


    from{

        brightness(.85);

        0 0 8px var(--green),

=================================================

        span.style.textShadow=

        `
        0 0 5px #ff0000,
        0 0 15px #ff0000,

        0 0 35px #3399ff

    else{


        span.style.color=color;


        span.style.textShadow=

        `
        0 0 4px ${color},
        0 0 12px ${color}

    }


}

/*

=================================================

*/


function typeChar(term,data,indexObj,side){



    const current=data[indexObj.line];



    if(!current){


        indexObj.line=0;

        indexObj.char=0;


        setTimeout(

            ()=>typeChar(
                term,
                data,
                indexObj,
                side

            20

        return;

    applyGlow(
        span,
        current.color

    span.classList.add("system-line");



    term.appendChild(span);



    indexObj.line++;

    indexObj.char=0;



    if(side==="left")

        linesLeft++;

        linesRight++;



}




else{
