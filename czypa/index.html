const left = document.getElementById("left");
const right = document.getElementById("right");

    char:0
};


let rightIndex = {
    line:0,
    char:0
};



let linesLeft = 0;
let linesRight = 0;



/*

TYPEWRITER SYSTEM

*/


function typeChar(term, data, indexObj, side){


    const current = data[indexObj.line];


    if(!current){

        indexObj.line = 0;
        indexObj.char = 0;

        setTimeout(
            ()=>typeChar(term,data,indexObj,side),
            20
        );

        return;

    }



    /*
    SPECIAL COLOR EVENTS
    */


    if(
        current.line.includes("CZYPA") ||
        current.line.includes("PROJECT") ||
        current.line.includes("FINAL STATUS") ||
        current.line.includes("AUTONOMOUS")
    ){


        const span=document.createElement("span");

        span.textContent=current.line+"\n";

        span.style.color=current.color;

        term.appendChild(span);


        indexObj.line++;

        indexObj.char=0;


        if(side==="left")
            linesLeft++;
        else
            linesRight++;


    }

    else{


        /*
        CHARACTER STREAM
        */


        const span=document.createElement("span");


        span.textContent =
            current.line[indexObj.char] || "";


        span.style.color=current.color;


        term.appendChild(span);



        indexObj.char++;




        if(indexObj.char >= current.line.length){


            const newline=document.createElement("span");


            newline.textContent="\n";


            term.appendChild(newline);



            /*
            RANDOM AI COMMENT
            RIGHT SCREEN ONLY
            */


            if(side==="right"){


                const comment =
                COMMENTS[
                    Math.floor(
                        Math.random()*COMMENTS.length
                    )
                ];



                const c=document.createElement("span");


                c.textContent=
                    " "+comment+"\n";


                c.className="gray";


                term.appendChild(c);


            }



            indexObj.char=0;

            indexObj.line++;



            if(side==="left")
                linesLeft++;
            else
                linesRight++;

        }


    }




    /*
    LIMIT MEMORY USAGE

    keeps interface alive

    */


    while(term.childNodes.length > 900){

        term.removeChild(
            term.firstChild
        );

    }



    /*
    AUTO SCROLL

    */


    term.scrollTop =
        term.scrollHeight;




    /*
    DIFFERENT SPEED FOR BOTH SCREENS

    */


    let speed;


    if(side==="left"){

        speed =
        Math.random()*12+3;

    }
    else{

        speed =
        Math.random()*10+4;

    }




    setTimeout(
        ()=>typeChar(term,data,indexObj,side),
        speed
    );

}
